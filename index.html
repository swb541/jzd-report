<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>集装袋 检验报告信息</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: #f1f2f4;
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB",
                 "Microsoft YaHei", "Helvetica Neue", Arial, sans-serif;
    color: #1a1a1a;
    -webkit-text-size-adjust: 100%;
    min-height: 100vh;
    padding: 24px 14px 40px;
  }
  .card {
    max-width: 520px;
    margin: 0 auto;
    background: #fff;
    padding: 34px 26px 30px;
    box-shadow: 0 1px 3px rgba(0,0,0,.06);
  }
  .kicker {
    text-align: center;
    font-size: 13px;
    letter-spacing: 1px;
    color: #999;
    margin: 0 0 10px;
  }
  h1 {
    margin: 0 0 22px;
    text-align: center;
    font-size: 26px;
    font-weight: 700;
    letter-spacing: 3px;
  }
  .rule {
    height: 1px;
    background: #e6e6e6;
    margin: 0 0 26px;
  }
  .rows { display: block; }
  .row {
    font-size: 17px;
    line-height: 1.95;
    padding: 5px 0 5px 6.4em;
    text-indent: -6.4em;
    overflow-wrap: anywhere;
  }
  .label { color: #4a4a4a; }
  .value { color: #111; }
  .value.ok { color: #111; }
  .footer {
    margin-top: 28px;
    padding-top: 16px;
    border-top: 1px solid #efefef;
    font-size: 12px;
    line-height: 1.7;
    color: #a0a0a0;
    text-align: center;
  }
  @media (max-width: 420px) {
    body { padding: 14px 10px 32px; }
    .card { padding: 26px 18px 24px; }
    h1 { font-size: 23px; }
    .row { font-size: 16px; padding-left: 6.2em; text-indent: -6.2em; }
  }
</style>
</head>
<body>
  <div class="card">
    <p class="kicker">检验报告信息</p>
    <h1>集装袋</h1>
    <div class="rule"></div>
    <div class="rows">
      <div class="row"><span class="label">样品名称：</span><span class="value">集装袋</span></div>
      <div class="row"><span class="label">报告编号：</span><span class="value">（2025）皖检DZ字第06131号</span></div>
      <div class="row"><span class="label">检验结果：</span><span class="value ok">合格</span></div>
      <div class="row"><span class="label">检验类型：</span><span class="value">型式试验</span></div>
      <div class="row"><span class="label">样品状态：</span><span class="value">外观无异常</span></div>
      <div class="row"><span class="label">委托单位：</span><span class="value">亿普顿新材料（河北省）有限公司</span></div>
      <div class="row"><span class="label">受检单位：</span><span class="value">亿普顿新材料（河北省）有限公司</span></div>
      <div class="row"><span class="label">生产单位：</span><span class="value">亿普顿新材料（河北省）有限公司</span></div>
      <div class="row"><span class="label">完成期限：</span><span class="value">2025-06-13</span></div>
    </div>
    <div class="footer">本页为检验报告电子信息展示页</div>
  </div>
</body>
</html>
